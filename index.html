<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Libro ingredienti</title><style>
*{box-sizing:border-box}body{margin:0;background:#F9F8F6;color:#1C1917;font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif;
line-height:1.5}main{max-width:760px;margin:0 auto;padding:20px 16px 40px}h1{font-size:22px;margin:0 0 4px}
.ver{color:#78716C;font-size:13px;margin:0 0 16px}.cerca{position:sticky;top:0;background:#F9F8F6;padding:8px 0 10px;z-index:1}
.cerca input{width:100%;font-size:16px;padding:10px 12px;border:1px solid #E7E5E4;border-radius:8px;background:#fff}
.cerca p{margin:6px 0 0;font-size:13px;color:#78716C}.nessuno{display:none;margin:12px 0;color:#A64D1A;font-weight:600}
h2{font-size:15px;color:#C25E20;margin:22px 0 8px;text-transform:uppercase;letter-spacing:.04em}
.prod{background:#fff;border:1px solid #E7E5E4;border-radius:8px;padding:12px 14px;margin:0 0 10px}
.prod h3{font-size:16px;margin:0 0 4px}.prod p{margin:4px 0;font-size:14px}.al{color:#44403C}.tr{color:#A64D1A}
footer{margin-top:24px;font-size:13px;color:#78716C}</style></head>
<body><main>
<h1>Libro ingredienti</h1><p class="ver">Libro ingredienti e allergeni · Versione del 06/11/2026 alle 14:41</p>
<div class="cerca"><input id="q" type="search" placeholder="Cerca un prodotto…" aria-label="Cerca un prodotto"><p>Non lo trovi? Chiedi al personale.</p></div>
<p id="nessuno" class="nessuno"></p>
<p class='nessuno' style='display:block'>Libro in aggiornamento: chiedere al personale.</p>
<footer>Per informazioni sugli allergeni chiedere al personale.</footer>
</main><script>
var q=document.getElementById('q'),n=document.getElementById('nessuno');
q.addEventListener('input',function(){var t=q.value.trim().toLowerCase(),v=0;
document.querySelectorAll('.prod').forEach(function(e){var ok=!t||e.getAttribute('data-nome').indexOf(t)>=0;e.style.display=ok?'':'none';if(ok)v++;});
document.querySelectorAll('section').forEach(function(s){var c=0;s.querySelectorAll('.prod').forEach(function(e){if(e.style.display!=='none')c++;});s.style.display=c?'':'none';});
n.textContent='Nessun prodotto con \u201c'+q.value.trim()+'\u201d: chiedi al personale.';n.style.display=(t&&!v)?'block':'none';});</script></body></html>
